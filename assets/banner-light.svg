<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Shawn du Preez. Apps, games and tinkering.">
  <style>
    .w { animation: slide linear infinite; }
    .w1 { animation-duration: 14s; }
    .w2 { animation-duration: 20s; animation-direction: reverse; }
    .w3 { animation-duration: 26s; }
    .wf { animation-duration: 32s; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-320px); } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .p { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0a0a0a" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.78" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#6aa8f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6aa8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
