    <text x="62" y="160" fill="#0a0a0a" font-size="68" font-weight="800" letter-spacing="-1.5">Shawn du Preez</text>
    <text x="64" y="204" fill="#52525b" font-size="22" font-weight="500">I build the apps and games I want to use myself<tspan class="caret" fill="#2563eb">_</tspan></text>
