    <path class="w w3" d="M -530 280 q 80 -12 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0 t 160 0" fill="none" stroke="#1e3a8a" stroke-opacity="0.45" stroke-width="1.5"/>
